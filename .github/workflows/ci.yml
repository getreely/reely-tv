name: CI

# The release workflow only runs on a tag, so without this a broken commit sits unnoticed
# until the moment you try to publish it. This builds and checks every push instead.
on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

# A second push supersedes the first; there is no reason to keep building a commit that
# has already been replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The wrapper is a binary committed to the repository, and it runs with whatever
      # rights the build has. This checks it is one Gradle actually published.
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # One invocation so a failure in any of the three still reports the other two,
      # rather than stopping at the first and hiding the rest.
      - name: Build, test and lint
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintRelease --no-daemon --continue

      # The test report is the only way to see which case failed without reproducing it.
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-release.html
          retention-days: 14
          if-no-files-found: ignore

      # A build to sideload without tagging a release for it. Debug-signed, so it will not
      # install over a release build.
      - name: Keep the debug build
        uses: actions/upload-artifact@v4
        with:
          name: reely-tv-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
