name: iOS

on:
  push:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: xcodebuild -version && swift --version

      - name: Core tests
        working-directory: ios/ReelyCore
        run: swift test

      - name: Project
        working-directory: ios
        run: brew install xcodegen && xcodegen generate

      - name: iPhone and iPad
        working-directory: ios
        run: |
          xcodebuild -quiet -project Reely.xcodeproj -scheme Reely -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build

      - name: Apple TV
        working-directory: ios
        run: |
          xcodebuild -quiet -project Reely.xcodeproj -scheme ReelyTV -configuration Debug \
            -destination 'generic/platform=tvOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build

      - name: Screenshots
        working-directory: ios
        run: scripts/screenshots.sh build/Build/Products shots

      - name: Screenshots as notes
        if: always()
        working-directory: ios
        run: scripts/annotate-shots.sh shots || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screenshots
          path: ios/shots
          if-no-files-found: ignore
