name: Release Live TV APK

# 0.26.0 onwards: Plezy's Plex client with this project's live television grafted on.
# The fork is not vendored here — the repository carries a patch and the commit it
# applies to, and this rebuilds from those. That keeps the diff reviewable and is what
# makes the GPL obligation easy to meet: upstream plus the patch is the whole source.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Flutter, the NDK and mpv together do not fit beside everything the runner image
      # ships with. None of what goes here is used by this build.
      - name: Make room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk \
                      /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      # 21, not 17. AGP 9's lint runs as part of assembleRelease and calls
      # List.removeLast(), which arrived with Java 21's sequenced collections — on 17 it
      # dies inside CommentDetector with a NoSuchMethodError that looks like a lint bug
      # and is really a toolchain mismatch. The build still targets 17.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The libmpv module pins this exact version, and the runner image does not carry it.
      - name: Install the CMake libmpv wants
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --install "cmake;4.1.2" "platforms;android-37" > /dev/null || \
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --install "cmake;4.1.2" <<< "y" > /dev/null

      - name: Fetch upstream and apply the patch
        run: |
          UPSTREAM=$(cat plezy-integration/UPSTREAM_COMMIT)
          echo "Building against edde746/plezy @ $UPSTREAM"
          git clone --filter=blob:none https://github.com/edde746/plezy.git work
          git -C work checkout "$UPSTREAM"
          git -C work apply --verbose "$GITHUB_WORKSPACE/plezy-integration/reely-livetv.patch"

      # Without this the build falls back to a debug key, which Android will not accept
      # as an update over anything signed with ours.
      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::No RELEASE_KEYSTORE_BASE64. A debug-signed build cannot update an install."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > work/android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_TEMP/release.jks
          EOF

      - name: Build
        working-directory: work
        run: |
          flutter pub get
          # One APK per ABI, which is how Plezy builds for the Amazon store. It makes the
          # fault that broke 0.26.0 impossible rather than something to detect afterwards:
          # each archive holds one ABI and the engine that matches it, so there is no slice
          # for Android to select and then fail to start.
          flutter build apk --release --split-per-abi

      # The asset names are what the app's update check asks for: it derives the
      # manifest's address from the APK's by swapping the extension.
      #
      # armeabi-v7a is the one the update check points at. Every Fire TV runs 32-bit ARM,
      # including the 64-bit ones, so it is the build that cannot pick the wrong device.
      # arm64 rides along for anything that would rather have it.
      - name: Collect and describe
        id: collect
        run: |
          mkdir -p out
          APKS=work/build/app/outputs/flutter-apk
          cp "$APKS/app-armeabi-v7a-release.apk" out/reely-tv.apk
          cp "$APKS/app-arm64-v8a-release.apk" out/reely-tv-arm64.apk

          # Read the version out of the APK rather than the build file. --split-per-abi
          # rewrites versionCode per ABI, and upstream's AMAZON switch adds 3000 to it, so
          # the number in the source is not the number that ships — and the update check
          # compares what the manifest claims against what is installed.
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          BADGING=$("$AAPT" dump badging out/reely-tv.apk | head -1)
          CODE=$(sed -n "s/.*versionCode='\\([0-9]*\\)'.*/\\1/p" <<< "$BADGING")
          VERSION=$(sed -n "s/.*versionName='\\([^']*\\)'.*/\\1/p" <<< "$BADGING")
          echo "Publishing $VERSION (versionCode $CODE)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          python3 - "$CODE" "$VERSION" "$(stat -c%s out/reely-tv.apk)" <<'PY'
          import json, sys, datetime
          code, name, size = sys.argv[1], sys.argv[2], sys.argv[3]
          json.dump({
            "versionCode": int(code),
            "versionName": name,
            "sizeBytes": int(size),
            "published": datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "notes": "Plex by Plezy, live television by Reely. One app, two halves.",
          }, open("out/reely-tv.json", "w"), indent=2)
          PY
          cat out/reely-tv.json

      # A signature check and a badging dump both passed on the build that would not
      # start: badging lists which ABIs are present and says nothing about what is in
      # them. This checks the property that actually decides whether the app runs.
      - name: Check every ABI can actually start
        run: |
          python3 - <<'PY'
          import zipfile, sys, collections, glob
          failed = []
          for apk in sorted(glob.glob("out/*.apk")):
              abis = collections.defaultdict(set)
              for n in zipfile.ZipFile(apk).namelist():
                  parts = n.split("/")
                  if len(parts) == 3 and parts[0] == "lib":
                      abis[parts[1]].add(parts[2])
              if not abis:
                  failed.append(f"{apk}: no native libraries at all")
                  continue
              for abi, libs in sorted(abis.items()):
                  missing = {"libflutter.so", "libapp.so"} - libs
                  state = f"MISSING {sorted(missing)}" if missing else "ok"
                  print(f"{apk}  {abi}: {len(libs)} libraries {state}")
                  if missing:
                      failed.append(f"{apk} [{abi}]")
          if failed:
              sys.exit("::error::" + "; ".join(failed) +
                       " — native code with no Flutter engine behind it. Android may "
                       "select one of these and the app will die on launch.")
          PY

      - name: Check both are signed with our key
        run: |
          SIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          for apk in out/*.apk; do
            echo "--- $apk"
            "$SIGNER" verify --print-certs "$apk" | head -2
            "$SIGNER" verify --print-certs "$apk" | grep -q "CN=Reely TV" \
              || { echo "::error::$apk is not signed with the release key."; exit 1; }
          done

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.collect.outputs.version }}
        run: |
          UPSTREAM=$(cat plezy-integration/UPSTREAM_COMMIT)
          cat > notes.md <<EOF
          Plex by [Plezy](https://github.com/edde746/plezy), live television by Reely.

          Built from edde746/plezy @ \`$UPSTREAM\` with \`plezy-integration/reely-livetv.patch\`
          applied. Plezy is GPL-3.0; that commit plus the patch in this repository is the
          complete corresponding source.

          Two entries appear on the television's home screen: the library, and live TV.
          EOF
          gh release delete "v$VERSION" --yes --cleanup-tag 2>/dev/null || true
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "Reely TV $VERSION" \
            --notes-file notes.md \
            out/reely-tv.apk out/reely-tv-arm64.apk out/reely-tv.json
