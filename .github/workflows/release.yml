name: Release APK

# Tag a commit and the build that comes out of it is published with the manifest the
# app's update check reads. Run it by hand from the Actions tab when there is no tag
# worth making.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, because the release notes are the commits since the last
          # tag and a shallow clone has neither the commits nor the tags.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # A release labelled v0.21.0 holding a 0.20.0 build would never be offered as an
      # update: the app compares the versionCode in the manifest, not the name on the
      # release page. Catch that here rather than after publishing it.
      - name: Check the tag matches the build
        id: version
        run: |
          VERSION=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | head -1 | cut -d'"' -f2)
          CODE=$(grep -o 'versionCode = [0-9]*' app/build.gradle.kts | head -1 | awk '{print $3}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION (versionCode $CODE)."
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $VERSION." \
                 "Publishing it would label the release with a version the app never reports," \
                 "so the update check would disagree with the release page. Fix one or the other."
            exit 1
          fi

      # Without a keystore the build falls back to a debug key, and a debug key is
      # generated per machine. Android refuses to update an app whose package is signed
      # by a different key, so a release not signed by us would mean uninstalling every
      # time. The secret is read through the environment rather than an `if` expression,
      # which is not somewhere the secrets context can be relied upon.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "Signing with the configured release key."
          else
            echo "::warning::No RELEASE_KEYSTORE_BASE64 secret. This build gets a throwaway" \
                 "debug key and cannot update an install signed by any other key."
          fi

      - name: Build
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -f "$RUNNER_TEMP/release.jks" ]; then
            ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon \
              -PRELEASE_STORE_FILE="$RUNNER_TEMP/release.jks" \
              -PRELEASE_STORE_PASSWORD="$STORE_PASSWORD" \
              -PRELEASE_KEY_ALIAS="$KEY_ALIAS" \
              -PRELEASE_KEY_PASSWORD="$KEY_PASSWORD"
          else
            ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon
          fi

      # The asset has to be named for what the app asks for: the update check derives the
      # manifest's address from the APK's by swapping the extension, so the two must sit
      # together under the same name.
      - name: Collect artefacts
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/reely-tv.apk
          cp app/build/outputs/apk/release/reely-tv.json out/reely-tv.json

      # What changed, from the commits since the last release. Two audiences: the release
      # page gets all of it, and the manifest gets a sentence, because the update check
      # shows that on a television where nobody wants to read a changelog.
      - name: Write what changed
        run: |
          PREVIOUS=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$PREVIOUS" ]; then
            echo "Changes since $PREVIOUS:" > notes.md
            echo >> notes.md
            git log --no-merges --pretty='- %s' "$PREVIOUS..HEAD" >> notes.md
          else
            echo "Recent changes:" > notes.md
            echo >> notes.md
            git log --no-merges --pretty='- %s' -25 >> notes.md
          fi
          echo >> notes.md
          echo "Built from \`${GITHUB_SHA}\`. Install \`reely-tv.apk\`; \`reely-tv.json\` is what the app's update check reads." >> notes.md
          python3 - <<'PY'
          import json, re
          lines = [l[2:].strip() for l in open("notes.md") if l.startswith("- ")]
          summary = "  ·  ".join(lines[:3])
          if len(summary) > 200:
              summary = summary[:197].rstrip() + "..."
          if len(lines) > 3:
              summary += f"  (+{len(lines) - 3} more)"
          manifest = json.load(open("out/reely-tv.json"))
          manifest["notes"] = summary
          json.dump(manifest, open("out/reely-tv.json", "w"), indent=2)
          PY
          cat out/reely-tv.json
          cat notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then TAG="$GITHUB_REF_NAME"; else TAG="v$VERSION"; fi
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Reely TV $VERSION" \
            --notes-file notes.md \
            out/reely-tv.apk out/reely-tv.json
