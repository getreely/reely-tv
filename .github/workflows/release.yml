name: Release

# Each app has its own version, kept beside it, and is released only when that changes:
#
#   Fire TV, Android TV, phones   app/build.gradle.kts   tag v0.58.0      (the update check reads this one)
#   iPhone, iPad                  ios/project.yml        tag ios-v0.58.0
#   LG                            webos/package.json     tag lg-v0.58.0
#   Roku                          roku/package.json      tag roku-v0.58.0
#
# Run it by hand from the Actions tab. An app whose version has no release yet is built,
# tested and published; the rest are left alone, so nobody is offered an update for an
# app that didn't change. The Android release is the one marked Latest, because the app's
# update check asks for releases/latest/download/reely-tv.apk; the others never are.
on:
  workflow_dispatch:
    inputs:
      apps:
        description: "Only these, again even if already released (android, ios, lg, roku, comma-separated). Empty: every app with a new version."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.plan.outputs.android }}
      ios: ${{ steps.plan.outputs.ios }}
      lg: ${{ steps.plan.outputs.lg }}
      roku: ${{ steps.plan.outputs.roku }}
      android_version: ${{ steps.plan.outputs.android_version }}
      ios_version: ${{ steps.plan.outputs.ios_version }}
      lg_version: ${{ steps.plan.outputs.lg_version }}
      roku_version: ${{ steps.plan.outputs.roku_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Which apps have a new version
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          ONLY: ${{ inputs.apps }}
        run: |
          android=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | head -1 | cut -d'"' -f2)
          ios=$(grep -o 'MARKETING_VERSION: "[^"]*"' ios/project.yml | head -1 | cut -d'"' -f2)
          lg=$(node -p 'require("./webos/package.json").version')
          roku=$(node -p 'require("./roku/package.json").version')
          # The LG and Roku apps carry their version in a second place each, read by the TV.
          [ "$(node -p 'require("./webos/public/appinfo.json").version')" = "$lg" ] || { echo "::error::webos/public/appinfo.json doesn't say $lg: run webos/scripts/set-version.mjs."; exit 1; }
          said=$(for k in major_version minor_version build_version; do grep "^$k=" roku/manifest | cut -d= -f2; done | paste -sd.)
          [ "$said" = "$roku" ] || { echo "::error::roku/manifest says $said, not $roku: run roku/scripts/set-version.mjs."; exit 1; }
          decide() {
            if [ -n "$ONLY" ]; then
              case ",${ONLY// /}," in *",$1,"*) echo true ;; *) echo false ;; esac
            elif gh release view "$2" >/dev/null 2>&1; then
              echo false
            else
              echo true
            fi
          }
          {
            echo "android=$(decide android "v$android")"
            echo "ios=$(decide ios "ios-v$ios")"
            echo "lg=$(decide lg "lg-v$lg")"
            echo "roku=$(decide roku "roku-v$roku")"
            echo "android_version=$android"
            echo "ios_version=$ios"
            echo "lg_version=$lg"
            echo "roku_version=$roku"
          } | tee -a "$GITHUB_OUTPUT"

  # The iPhone and iPad app, unsigned: there's no Apple developer account to sign it with
  # yet, so it's for sideloading (AltStore, Sideloadly), which signs it with the person's
  # own Apple ID.
  ios:
    needs: plan
    if: needs.plan.outputs.ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.plan.outputs.ios_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
          path: ios/Vendor
          key: vlckit-${{ hashFiles('ios/scripts/vlckit.sh') }}

      - name: Build the iPhone and iPad app
        working-directory: ios
        run: |
          set -o pipefail
          scripts/vlckit.sh
          brew install xcodegen && xcodegen generate
          xcodebuild -quiet -project Reely.xcodeproj -scheme Reely -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            MARKETING_VERSION="$VERSION" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload out
          cp -R build/Build/Products/Release-iphoneos/Reely.app Payload/
          zip -qry out/reely-ios.ipa Payload

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ios-v$VERSION"
          .github/scripts/notes.sh 'ios-v*' "$TAG" ios
          echo "\`reely-ios.ipa\` is the iPhone and iPad app, unsigned, for sideloading with AltStore or Sideloadly." >> notes.md
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" --target "$GITHUB_SHA" --latest=false \
            --title "Reely for iPhone and iPad $VERSION" --notes-file notes.md ios/out/reely-ios.ipa

  # Fire TV, Android TV and Android phones, with the manifest the app's update check reads,
  # and the store builds, which leave updates to the store.
  android:
    needs: plan
    if: needs.plan.outputs.android == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.plan.outputs.android_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, because the release notes are the commits since the last
          # release and a shallow clone has neither the commits nor the tags.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      # compileSdk is newer than the runner image ships with. A here-string rather than
      # `yes |` on purpose: the pipe leaves sdkmanager on the wrong end of a SIGPIPE, and
      # Actions runs bash with pipefail, so that would fail the step.
      - name: Install the compile SDK
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-37.0" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
              --install "platforms;android-37.0" <<< "y" > /dev/null
          fi

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # Without a keystore the build falls back to a debug key, and a debug key is
      # generated per machine. Android refuses to update an app whose package is signed
      # by a different key, so a release not signed by us would mean uninstalling every
      # time. The secret is read through the environment rather than an `if` expression,
      # which is not somewhere the secrets context can be relied upon.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "Signing with the configured release key."
          else
            echo "::warning::No RELEASE_KEYSTORE_BASE64 secret. This build gets a throwaway" \
                 "debug key and cannot update an install signed by any other key."
          fi

      - name: Build
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -f "$RUNNER_TEMP/release.jks" ]; then
            ./gradlew :app:testDebugUnitTest :app:assembleRelease :app:assembleStore :app:bundleStore --no-daemon \
              -PRELEASE_STORE_FILE="$RUNNER_TEMP/release.jks" \
              -PRELEASE_STORE_PASSWORD="$STORE_PASSWORD" \
              -PRELEASE_KEY_ALIAS="$KEY_ALIAS" \
              -PRELEASE_KEY_PASSWORD="$KEY_PASSWORD"
          else
            ./gradlew :app:testDebugUnitTest :app:assembleRelease :app:assembleStore :app:bundleStore --no-daemon
          fi

      # The asset has to be named for what the app asks for: the update check derives the
      # manifest's address from the APK's by swapping the extension, so the two must sit
      # together under the same name.
      - name: Collect artefacts
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/reely-tv.apk
          cp app/build/outputs/apk/release/reely-tv.json out/reely-tv.json
          cp app/build/outputs/apk/store/app-store.apk out/reely-tv-store.apk
          cp app/build/outputs/bundle/store/app-store.aab out/reely-tv-store.aab

      # Two audiences: the release page gets all of it, and the manifest gets a sentence,
      # because the update check shows that on a television where nobody wants to read a
      # changelog.
      - name: Write what changed
        run: |
          .github/scripts/notes.sh 'v[0-9]*' "v$VERSION" app gradle build.gradle.kts settings.gradle.kts gradle.properties
          echo "Install \`reely-tv.apk\` on Fire TV, Android TV and Android phones; \`reely-tv.json\` is what the app's update check reads. \`reely-tv-store.apk\` (Amazon Appstore) and \`reely-tv-store.aab\` (Google Play) are the store builds, which leave updates to the store." >> notes.md
          python3 - <<'PY'
          import json
          lines = [l[2:].strip() for l in open("notes.md") if l.startswith("- ")]
          summary = "  ·  ".join(lines[:3])
          if len(summary) > 200:
              summary = summary[:197].rstrip() + "..."
          if len(lines) > 3:
              summary += f"  (+{len(lines) - 3} more)"
          manifest = json.load(open("out/reely-tv.json"))
          manifest["notes"] = summary
          json.dump(manifest, open("out/reely-tv.json", "w"), indent=2)
          PY
          cat out/reely-tv.json
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" --target "$GITHUB_SHA" --latest \
            --title "Reely for Fire TV and Android $VERSION" --notes-file notes.md \
            out/reely-tv.apk out/reely-tv.json out/reely-tv-store.apk out/reely-tv-store.aab

  # The LG app, tested as CI tests it, packaged by LG's tool.
  lg:
    needs: plan
    if: needs.plan.outputs.lg == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.plan.outputs.lg_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webos/package-lock.json

      - name: Build the LG app
        working-directory: webos
        run: |
          npm ci
          npx tsc --noEmit -p . && npm test
          npx playwright install --with-deps chromium && npm run e2e
          npm run package

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="lg-v$VERSION"
          .github/scripts/notes.sh 'lg-v*' "$TAG" webos
          echo "\`reely-lg.ipk\` is the LG app, installed on a TV in Developer Mode." >> notes.md
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" --target "$GITHUB_SHA" --latest=false \
            --title "Reely for LG $VERSION" --notes-file notes.md webos/out/reely-lg.ipk

  # The Roku app, the same way: compiled, tested in the simulator, zipped for sideloading.
  roku:
    needs: plan
    if: needs.plan.outputs.roku == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.plan.outputs.roku_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: roku/package-lock.json

      - name: Build the Roku app
        working-directory: roku
        run: |
          npm ci
          npm run check && npm test
          npm run e2e
          npm run package

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="roku-v$VERSION"
          .github/scripts/notes.sh 'roku-v*' "$TAG" roku
          echo "\`reely-roku.zip\` is the Roku app, sideloaded on a Roku in developer mode." >> notes.md
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" --target "$GITHUB_SHA" --latest=false \
            --title "Reely for Roku $VERSION" --notes-file notes.md roku/out/reely-roku.zip
