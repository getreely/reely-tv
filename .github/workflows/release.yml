name: Release APK

# Tag a commit and the build that comes out of it is published with the manifest the
# app's update check reads. Run it by hand from the Actions tab when there is no tag
# worth making.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # Without a keystore the build falls back to a debug key, and a debug key is
      # generated per machine. Android refuses to update an app whose package is signed
      # by a different key, so a release not signed by us would mean uninstalling every
      # time. The secret is read through the environment rather than an `if` expression,
      # which is not somewhere the secrets context can be relied upon.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "Signing with the configured release key."
          else
            echo "::warning::No RELEASE_KEYSTORE_BASE64 secret. This build gets a throwaway" \
                 "debug key and cannot update an install signed by any other key."
          fi

      - name: Build
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -f "$RUNNER_TEMP/release.jks" ]; then
            ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon \
              -PRELEASE_STORE_FILE="$RUNNER_TEMP/release.jks" \
              -PRELEASE_STORE_PASSWORD="$STORE_PASSWORD" \
              -PRELEASE_KEY_ALIAS="$KEY_ALIAS" \
              -PRELEASE_KEY_PASSWORD="$KEY_PASSWORD"
          else
            ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon
          fi

      # The asset has to be named for what the app asks for: the update check derives the
      # manifest's address from the APK's by swapping the extension, so the two must sit
      # together under the same name.
      - name: Collect artefacts
        id: collect
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/reely-tv.apk
          cp app/build/outputs/apk/release/reely-tv.json out/reely-tv.json
          VERSION=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | head -1 | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          cat out/reely-tv.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.collect.outputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then TAG="$GITHUB_REF_NAME"; else TAG="v$VERSION"; fi
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            --title "Reely TV $VERSION" \
            --notes "Built from ${GITHUB_SHA}. Install reely-tv.apk; reely-tv.json is what the app's update check reads." \
            out/reely-tv.apk out/reely-tv.json
