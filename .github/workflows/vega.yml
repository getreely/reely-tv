name: Vega

# Reely for Fire TV sticks on Vega OS (vega/): its own React Native app, built with Amazon's
# Vega SDK and packaged as .vpkg for each kind of device. The SDK, and the hls.js build its
# video player uses (vega/scripts/hlsjs.sh), are Amazon's (Program Materials License,
# https://developer.amazon.com/support/legal/pml), fetched here unattended; neither needs an
# Amazon login. Installing on a stick, which needs developer mode, is in vega/README.md.
on:
  workflow_dispatch:
    inputs:
      test:
        description: "Also publish the packages as the 'vega-test' pre-release, to try on a stick before a release."
        type: boolean
        default: false
  workflow_call:
  push:
    paths:
      - "vega/**"
      - ".github/workflows/vega.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: What the SDK needs
        run: sudo apt-get update -q && sudo apt-get install -y -q jq lz4 gawk binutils curl
      - name: Vega SDK
        run: |
          curl -fsSL https://sdk-installer.vega.labcollab.net/get_vvm.sh | NONINTERACTIVE=true bash
          source ~/vega/env
          vega --version
          vega sdk list-installed || true
      - name: Build
        working-directory: vega
        run: |
          source ~/vega/env
          set +e
          # The manifest's module entries, as this SDK wants them, then the build.
          { npm ci && npm run typecheck && vega project update-manifest && npm run build:release; } > build.log 2>&1
          status=$?
          cat build.log
          ls -la build/*/ 2>/dev/null
          if [ $status -ne 0 ]; then
            # The end of what went wrong, as one note on the run, readable without the full log.
            echo "::error title=Vega build::$(tail -n 60 build.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          fi
          exit $status
      - uses: actions/upload-artifact@v4
        with:
          name: reely-vega
          path: vega/build/*/*.vpkg
          if-no-files-found: error
      - name: Test build
        if: ${{ inputs.test }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          for f in $(find vega/build -path '*-release/*.vpkg'); do
            arch=$(basename "$(dirname "$f")" | sed -E 's/-(release|debug)$//')
            cp "$f" "out/reely-vega-$arch.vpkg"
          done
          ls -la out
          gh release delete vega-test --yes --cleanup-tag 2>/dev/null || true
          gh release create vega-test --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Reely for Vega: test build" \
            --notes "A build of the new Vega app to try on a stick, not a release. Built from \`$GITHUB_SHA\`." out/*.vpkg
