name: Vega

# Reely for Fire TV sticks on Vega OS, built with Amazon's Vega SDK: the LG app's page, built
# and copied into the React Native shell (vega/), packaged as .vpkg for each kind of device.
# The SDK is Amazon's (Program Materials License, https://developer.amazon.com/support/legal/pml),
# installed here unattended; it needs no Amazon login to build. Installing on a stick, which
# needs developer mode, is in vega/README.md.
on:
  workflow_dispatch:
  workflow_call:
  push:
    paths:
      - "vega/**"
      - ".github/workflows/vega.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: What the SDK needs
        run: sudo apt-get update -q && sudo apt-get install -y -q jq lz4 gawk binutils curl
      - name: Vega SDK
        run: |
          curl -fsSL https://sdk-installer.vega.labcollab.net/get_vvm.sh | NONINTERACTIVE=true bash
          source ~/vega/env
          vega --version
          vega sdk list-installed || true
      - name: The page (the LG app, built)
        working-directory: webos
        run: npm ci
      - name: Build
        working-directory: vega
        run: |
          source ~/vega/env
          set +e
          # The manifest's module entries, as this SDK wants them, then the build.
          { npm ci --legacy-peer-deps && vega project update-manifest && npm run build:release; } > build.log 2>&1
          status=$?
          cat build.log
          ls -la build/*/ 2>/dev/null
          if [ $status -ne 0 ]; then
            # The end of what went wrong, as one note on the run, readable without the full log.
            echo "::error title=Vega build::$(tail -n 60 build.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          fi
          exit $status
      - uses: actions/upload-artifact@v4
        with:
          name: reely-vega
          path: vega/build/*/*.vpkg
          if-no-files-found: error
