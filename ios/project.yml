# Reely for iPhone, iPad and Apple TV. The Xcode project is made from this by XcodeGen
# (xcodegen generate); it isn't kept in the repository.
name: Reely
options:
  bundleIdPrefix: tv.reely
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
  createIntermediateGroups: true
packages:
  ReelyCore:
    path: ReelyCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.57.22"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    PRODUCT_NAME: Reely
targets:
  Reely:
    platform: iOS
    type: application
    dependencies:
      - package: ReelyCore
      # VLC's engine, for what Apple's player can't open: scripts/vlckit.sh fetches it.
      - framework: Vendor/MobileVLCKit.xcframework
        embed: true
    sources:
      - path: App/Shared
      - path: App/Resources/Fonts
        buildPhase: resources
      - path: App/iOS
    info:
      path: App/iOS/Info.plist
      properties:
        CFBundleDisplayName: Reely
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts: [geist_regular.ttf, geist_medium.ttf, geist_semibold.ttf, geist_bold.ttf]
        UILaunchScreen: {}
        # Plex servers at home answer over plain http as well as their plex.direct names.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Reely looks for your Plex server on your home network.
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Dark
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: tv.reely.app
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      TARGETED_DEVICE_FAMILY: "1,2"
  ReelyTV:
    platform: tvOS
    type: application
    dependencies:
      - package: ReelyCore
      - framework: Vendor/TVVLCKit.xcframework
        embed: true
    sources:
      - path: App/Shared
      - path: App/Resources/Fonts
        buildPhase: resources
      - path: App/tvOS
    info:
      path: App/tvOS/Info.plist
      properties:
        CFBundleDisplayName: Reely
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts: [geist_regular.ttf, geist_medium.ttf, geist_semibold.ttf, geist_bold.ttf]
        UILaunchScreen: {}
        # Plex servers at home answer over plain http as well as their plex.direct names.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Reely looks for your Plex server on your home network.
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Dark
        UIBackgroundModes: [audio]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: tv.reely.tv
      ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
      TARGETED_DEVICE_FAMILY: "3"
