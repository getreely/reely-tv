schema-version = 1

[package]
id = "tv.reely.vega"
title = "Reely"
version = "0.58.27"
icon = "@image/app_icon.png"

# Vega SDK 0.24 on: the OS versions the app runs on. `vega project install --fix` adds the
# module entries that go with these.
[os.version]
min = "1.2"
target = "1.2"

# Generated from [os.version] by `vega project update-manifest` (the build runs it too).
[[needs.module]]
id = "/com.amazon.vega.os@IVega_1_2"

[components]
[[components.interactive]]
id = "tv.reely.vega.main"
runtime-module = "/com.amazon.kepler.runtime.react_native_kepler_4@IReactNativeKepler_0"
launch-type = "singleton"
categories = ["com.amazon.category.main"]

[processes]
[[processes.group]]
component-ids = ["tv.reely.vega.main"]

[wants]
# Typing: search, sign-in to a provider, a server's address.
[[wants.service]]
id = "com.amazon.inputmethod.service"

# Video: films, episodes and channels, in Amazon's own player.
[[wants.service]]
id = "com.amazon.media.server"

[[wants.service]]
id = "com.amazon.media.playersession.service"

# Captions.
[[wants.privilege]]
id = "com.amazon.devconf.privilege.accessibility"

[[wants.service]]
id = "com.amazon.mediametrics.service"

[[wants.service]]
id = "com.amazon.mediabuffer.service"

[[wants.service]]
id = "com.amazon.mediatransform.service"

# Sound, and its volume and focus.
[[wants.service]]
id = "com.amazon.audio.stream"

[[wants.service]]
id = "com.amazon.audio.control"

# Accessibility (VoiceView).
[[wants.service]]
id = "com.amazon.kepler.ucc.publisher"

# Group IPC, for the media services.
[[wants.service]]
id = "com.amazon.gipc.uuid.*"

[offers]
[[offers.service]]
id = "com.amazon.gipc.uuid.*"

[needs]
[[needs.module]]
id = "/com.amazon.kepler.kepler_media_controls_1@IKeplerMediaControls_0"

[[needs.module]]
id = "/com.amazon.kepler.keplermediadescriptor_1@IKeplermediadescriptor_1"

[[needs.module]]
id = "/com.amazon.kepler.async_storage__async_storage_2@IAsyncStorage__AsyncStorage_1"

[[needs.module]]
id = "/com.amazon.kepler.keplerscript_4@IKeplerScript_0"

[[needs.module]]
id = "/com.amazon.kepler.svg_3@ISVG_0"

[[needs.module]]
id = "/com.amazon.kepler.w3cmedia_2@IW3cmedia_3"
